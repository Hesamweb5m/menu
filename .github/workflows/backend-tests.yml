name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "server/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite requires Node 22.5 or newer.
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm test
